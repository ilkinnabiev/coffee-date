<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdeff1">
    <meta name="description" content="Кофе, прогулка и шанс познакомиться. Маленькое приглашение для тебя.">
    <meta property="og:title" content="У меня к тебе маленький вопрос ♡">
    <meta property="og:description" content="Кое-кто очень хочет с тобой познакомиться.">
    <meta property="og:type" content="website">
    <title>Маленькое приглашение ♡</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="invitation">
      <p class="eyebrow"><span aria-hidden="true">♡</span> Приглашение для тебя</p>

      <div class="illustration">
        <img class="cat" src="assets/cat.webp" alt="Котик обнимает розовое сердечко" width="640" height="640" fetchpriority="high">
        <span class="spark spark-one" aria-hidden="true">♡</span>
        <span class="spark spark-two" aria-hidden="true">✧</span>
      </div>

      <h1>Пойдём на<br>свидание?</h1>
      <p class="description">Кофе, прогулка<br>и шанс познакомиться.</p>

      <div class="play-area" aria-label="Ответ на приглашение">
        <a class="answer answer-yes" href="https://t.me/IlkinNabiev">
          Да <span aria-hidden="true">♡</span>
        </a>
        <button class="answer answer-no" type="button">Нет</button>
      </div>

      <p class="reaction" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </body>
</html>
